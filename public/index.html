<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libredium | Read Medium Without Limits</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #fcfdfe;
            --bg-card: #ffffff;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.05);
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --font-serif: "Lora", serif;
            --font-display: "Raleway", sans-serif;
            --font-sans: "Inter", sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -2px rgb(0 0 0 / 0.05);
            --nav-height: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Navbar --- */
        nav {
            height: var(--nav-height);
            width: 100%;
            position: fixed;
            top: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        nav.scrolled {
            height: 60px;
            box-shadow: var(--shadow-sm);
        }

        .nav-logo {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            font-family: var(--font-display);
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* --- Hero Section --- */
        .hero {
            padding-top: calc(var(--nav-height) + 4rem);
            padding-bottom: 4rem;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.03;
            pointer-events: none;
        }

        .hero-content {
            width: 100%;
            max-width: 900px;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 8vw, 4.8rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            letter-spacing: -0.05em;
        }

        .hero p {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            color: var(--text-secondary);
            margin-bottom: 3rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 500;
        }

        /* --- Search Container --- */
        .search-container {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            position: relative;
        }

        .search-box {
            background: white;
            border-radius: 20px;
            padding: 0.6rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            display: flex;
            border: 1px solid var(--border);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 500px) {
            .search-box {
                flex-direction: column;
                padding: 1rem;
                gap: 0.8rem;
                border-radius: 16px;
            }
        }

        .search-box:focus-within {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 40px 60px -15px rgba(37, 99, 235, 0.15);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            background: transparent;
            font-family: var(--font-sans);
            color: var(--text-main);
            min-width: 0; /* Important for flex-shrink on mobile */
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 15px;
            font-weight: 800;
            font-family: var(--font-display);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: auto;
        }

        @media (max-width: 500px) {
            .search-box button {
                width: 100%;
                padding: 1rem;
            }
        }

        .search-box button:hover {
            background: #1d4ed8;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        /* --- Article Section --- */
        #article-wrapper {
            display: none;
            padding: 6rem 0;
            background: white;
            border-top: 1px solid var(--border);
        }

        #article-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .article-toolbar {
            width: 100%;
            padding: 0 5% 3rem 5%;
            display: flex;
            justify-content: flex-end;
        }

        .article-inner {
            width: 100%;
            padding: 0 5%;
            max-width: 100%;
        }

        .article-title {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 2rem;
            color: var(--text-main);
            letter-spacing: -0.04em;
            text-align: left;
        }

        .article-meta {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem 2.5rem;
            font-family: var(--font-display);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .article-cover {
            width: 100%;
            max-height: 90vh;
            object-fit: cover;
            margin-bottom: 6rem;
            box-shadow: var(--shadow-lg);
        }

        .article-body {
            font-family: var(--font-serif);
            font-size: clamp(1.15rem, 2.5vw, 1.5rem);
            line-height: 1.75;
            color: #1e293b;
            width: 100%;
            max-width: 800px; /* Optimal reading width */
            margin: 0 auto;
        }

        .article-body p { margin-bottom: 2.2rem; }
        .article-body h1, .article-body h2, .article-body h3, .article-body h4 {
            font-family: var(--font-display);
            margin: 4rem 0 1.8rem 0;
            line-height: 1.2;
            color: var(--text-main);
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        .article-body h1 { font-size: clamp(1.8rem, 5vw, 3rem); }
        .article-body h2 { font-size: clamp(1.6rem, 4vw, 2.5rem); }
        .article-body h3 { font-size: clamp(1.4rem, 3vw, 2.1rem); }

        /* Images & Media */
        .article-body img {
            max-width: 100%;
            width: 100%;
            height: auto;
            margin: 5rem 0;
            display: block;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.1);
        }

        .article-body blockquote {
            border-left: 10px solid var(--accent);
            padding: 3.5rem;
            background: var(--accent-soft);
            font-style: italic;
            font-size: 2.2rem;
            margin: 6rem 0;
            color: var(--text-main);
            border-radius: 0 24px 24px 0;
            font-family: var(--font-serif);
        }

        .article-body pre {
            background: #0f172a;
            color: #f8fafc;
            padding: 3rem;
            border-radius: 24px;
            overflow-x: auto;
            margin: 4.5rem 0;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 1.1rem;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- Footer --- */
        footer {
            padding: 8rem 5%;
            background: var(--bg-page);
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .footer-logo {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            display: block;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: -2px;
        }

        .footer-logo span { color: var(--accent); }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 4rem;
            margin-bottom: 4rem;
        }

        .footer-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 700;
            font-family: var(--font-display);
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .footer-links a:hover { color: var(--accent); }

        .copyright {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* --- UI Components --- */
        .btn-download {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1.25rem 2.5rem;
            border-radius: 16px;
            font-weight: 900;
            font-family: var(--font-display);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-download:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.4);
            background: #1d4ed8;
        }

        #loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
        }

        .spinner {
            width: 100px;
            height: 100px;
            border: 6px solid #f1f5f9;
            border-top: 6px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #status {
            position: fixed;
            bottom: 3rem;
            right: 3rem;
            padding: 1.5rem 3rem;
            border-radius: 20px;
            background: white;
            box-shadow: var(--shadow-lg);
            transform: translateY(200%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 3000;
            font-weight: 800;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status.visible { transform: translateY(0); }
        .status-error { color: #ef4444; border: 2px solid #ef4444; }
        .status-success { color: #10b981; border: 2px solid #10b981; }

        /* Responsive Mobile Update */
        @media (max-width: 768px) {
            nav { padding: 0 1.5rem; }
            .nav-logo { font-size: 1.4rem; }
            .nav-links { display: none; }
            
            #article-wrapper { padding: 3rem 0; }
            .article-inner { padding: 0 1.5rem; }
            
            .article-body blockquote {
                padding: 1.5rem 2rem;
                font-size: 1.5rem;
                margin: 3rem 0;
                border-left-width: 6px;
                border-radius: 0 16px 16px 0;
            }
            
            .article-body img { margin: 3rem 0; }
            .article-body pre { padding: 1.5rem; border-radius: 16px; margin: 2rem 0; font-size: 0.95rem; }
            
            footer { padding: 4rem 1.5rem; }
            .footer-links { gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
            
            #status {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
                padding: 1rem 1.5rem;
                text-align: center;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .hero h1 { line-height: 1.1; }
            .article-title { line-height: 1.2; }
            .article-meta { gap: 1rem; }
            .article-meta span { font-size: 0.85rem; }
        }

    </style>
</head>
<body>

    <nav id="navbar" class="no-print">
        <a href="/" class="nav-logo">Libredium<span></span></a>
        <div class="nav-links">
            <a href="#">Explore</a>
            <a href="#">Security</a>
            <a href="#">Principles</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero no-print">
        <div class="hero-content">
            <h1>Read Medium Without Limits</h1>
            <p>Read every Medium article, no subscription needed.</p>
            
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="urlInput" placeholder="https://medium.com/... or custom domain link" aria-label="Article URL">
                    <button onclick="fetchArticle()">Unlock</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <section id="article-wrapper">

        <div id="article-container">
            <div class="article-inner" id="print-area">
                <h1 id="title" class="article-title"></h1>
                <div id="meta-container" class="article-meta">
                    <span id="author"></span>
                    <span id="date"></span>
                </div>
                <img id="cover" class="article-cover" alt="Article Cover" style="display: none;">
                <div id="content" class="article-body"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="no-print">
        <a href="/" class="footer-logo">Libredium<span></span></a>
        <div class="footer-links">
            <a href="#">Protocol</a>
            <a href="#">Audit</a>
            <a href="#">Vault</a>
            <a href="#">Status</a>
        </div>
        <p class="copyright">&copy; 2026 Libredium. Minimalist reading for the modern web.</p>
    </footer>

    <!-- Loading -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 2.5rem; color: var(--text-secondary); font-weight: 900; font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase;">Synthesizing Experience</p>
    </div>

    <!-- Notifications -->
    <div id="status"></div>

    <script>
        const navbar = document.getElementById('navbar');
        const urlInput = document.getElementById('urlInput');
        const loader = document.getElementById('loader');
        const statusEl = document.getElementById('status');
        const articleWrapper = document.getElementById('article-wrapper');

        // Sticky Nav effect
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });

        // Enter key support
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchArticle();
        });

        function showStatus(msg, type = 'error') {
            statusEl.textContent = msg;
            statusEl.className = `visible status-${type}`;
            setTimeout(() => statusEl.classList.remove('visible'), 5000);
        }

        async function fetchArticle() {
            const url = urlInput.value.trim();
            if (!url) {
                showStatus('Please enter a valid URL');
                return;
            }

            loader.style.display = 'flex';
            
            try {
                const res = await fetch(`/api/article?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                if (data.success) {
                    renderArticle(data);
                    articleWrapper.style.display = 'block';
                    articleWrapper.scrollIntoView({ behavior: 'smooth' });
                } else {
                    showStatus(data.error || 'Failed to fetch article');
                }
            } catch (err) {
                showStatus('Connection error. Is the server running?');
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderArticle(data) {
            document.title = `${data.title} | Libredium`;
            document.getElementById('title').textContent = data.title;
            
            // AUTHOR FIX: Remove "By Unknown" if missing
            const authorEl = document.getElementById('author');
            const metaContainer = document.getElementById('meta-container');
            
            if (data.author && data.author.toLowerCase() !== 'unknown') {
                authorEl.style.display = 'flex';
                authorEl.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${data.author}`;
            } else {
                authorEl.style.display = 'none';
            }
            
            const dateEl = document.getElementById('date');
            if (data.publishDate) {
                const date = new Date(data.publishDate);
                dateEl.style.display = 'flex';
                dateEl.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
            } else {
                dateEl.style.display = 'none';
            }

            // If neither author nor date, hide meta container
            if (authorEl.style.display === 'none' && dateEl.style.display === 'none') {
                metaContainer.style.display = 'none';
            } else {
                metaContainer.style.display = 'flex';
            }

            const cover = document.getElementById('cover');
            if (data.coverImage) {
                cover.src = data.coverImage;
                cover.style.display = 'block';
            } else {
                cover.style.display = 'none';
            }

            document.getElementById('content').innerHTML = data.content;
        }

    </script>
</body>
</html>
